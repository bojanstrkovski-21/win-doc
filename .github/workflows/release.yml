name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish a self-contained exe
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Pack the exe
        shell: pwsh
        run: Compress-Archive -Path publish/win-dock.exe -DestinationPath win-dock-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: win-dock-win-x64.zip
          generate_release_notes: true
          body: |
            Self-contained Windows x64 build. Unzip win-dock.exe and run it.
            The first run adds win-dock to your user startup so it opens at login.
